global
    maxconn 1000
    log stdout format raw local0
    # Runtime API for the Patroni hooks. Reachable only inside the lab Docker network (port not published).
    stats socket ipv4@0.0.0.0:9999 level admin

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

defaults
    mode tcp
    retries 2
    timeout connect 5s
    timeout client  30m
    timeout server  30m
    timeout check   3s

# Status page: http://localhost:7000
listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 5s

# Writes: always the current Patroni leader.
# The Patroni hooks switch servers here at once on a planned leader change (runtime API, port 9999);
# the health checks below are the backup and handle crashes. rise 3 keeps a node the hook marked down
# from coming back while Patroni still reports it as leader during its demotion.
listen primary
    bind *:5000
    log global
    option tcplog
    option httpchk
    http-check connect port 8008
    http-check send meth GET uri /primary
    http-check expect status 200
    default-server inter 1s fall 2 rise 3 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
    server pg1 pg1:5432 check
    server pg2 pg2:5432 check
    server pg3 pg3:5432 check
    server pg4 pg4:5432 check
    server pg5 pg5:5432 check

# Reads: healthy replicas, round robin
listen replicas
    bind *:5001
    balance roundrobin
    option httpchk
    http-check connect port 8008
    http-check send meth GET uri /replica
    http-check expect status 200
    default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
    server pg1 pg1:5432 check
    server pg2 pg2:5432 check
    server pg3 pg3:5432 check
    server pg4 pg4:5432 check
    server pg5 pg5:5432 check
