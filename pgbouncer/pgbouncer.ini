; Clients -> PgBouncer (6432) -> HAProxy primary (5000) -> current Patroni leader.
; During a planned leader change the Patroni hooks send PAUSE (running transactions finish,
; new queries wait) and RESUME once the new leader is in HAProxy's pool.
[databases]
* = host=haproxy port=5000

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
pidfile =
logfile =

auth_type = scram-sha-256
auth_file = /tmp/userlist.txt
auth_user = postgres
auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename = $1
admin_users = postgres
stats_users = postgres

pool_mode = transaction
max_prepared_statements = 200
max_client_conn = 500
default_pool_size = 20
reserve_pool_size = 5

; queries wait this long for a server (e.g. while paused) before the client is disconnected
query_wait_timeout = 120
; after a failed server login, retry after 1 s instead of 15 s (clients get errors meanwhile)
server_login_retry = 1
server_connect_timeout = 5
ignore_startup_parameters = extra_float_digits,options

; TLS required (phase 2): clients must use TLS; the server certificate and name are checked
; (host "haproxy" is on every node's certificate). Phase 1 was prefer / prefer.
client_tls_sslmode = require
client_tls_cert_file = /tls/server.crt
client_tls_key_file = /tls/server.key
; required even without client certificates: unset, PgBouncer loads the system CA bundle, which this image lacks
client_tls_ca_file = /tls/ca.crt
server_tls_sslmode = verify-full
server_tls_ca_file = /tls/ca.crt

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60
